<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibePrompt Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="vp-opts">
      <header class="vp-opts-header">
        <div>
          <h1>VibePrompt</h1>
          <p class="vp-opts-tag">Minimal · personalized · context-aware</p>
        </div>
      </header>

      <form id="settings-form" class="vp-opts-form" autocomplete="off">
        <label class="vp-field">
          <span class="vp-label">Groq API key</span>
          <div class="vp-key-row">
            <input
              id="groqApiKey"
              name="groqApiKey"
              type="password"
              placeholder="gsk_…"
              spellcheck="false"
              autocomplete="off"
            />
            <button type="button" id="toggle-key" class="vp-btn-secondary" aria-pressed="false">
              Show
            </button>
          </div>
          <span class="vp-hint"
            >Stored only in this browser. Get a key at
            <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer"
              >console.groq.com/keys</a
            >.</span
          >
        </label>

        <label class="vp-field">
          <span class="vp-label">Backend URL</span>
          <input
            id="apiBaseUrl"
            name="apiBaseUrl"
            type="url"
            placeholder="http://localhost:8000"
            spellcheck="false"
          />
        </label>

        <fieldset class="vp-field">
          <legend class="vp-label">Learning context (optional)</legend>
          <input id="lcSubject" type="text" placeholder="Subject — e.g. Operating Systems" />
          <input id="lcResource" type="text" placeholder="Resource — e.g. Operating System Concepts" />
          <input id="lcTopic" type="text" placeholder="Current topic — e.g. Process Management" />
          <input id="lcLevel" type="text" placeholder="Level — beginner / intermediate / advanced" />
          <span class="vp-hint">Used only when relevant to the current prompt.</span>
        </fieldset>

        <div class="vp-actions">
          <button type="submit" class="vp-btn-primary">Save</button>
          <button type="button" id="clear-key" class="vp-btn-secondary">Clear API key</button>
          <button type="button" id="reset-profile" class="vp-btn-secondary">Reset profile</button>
        </div>

        <p id="status" class="vp-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
