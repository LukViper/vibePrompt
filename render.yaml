# Render Blueprint — deploy the VibePrompt API from this Git repo.
# Dashboard: New → Blueprint → connect github.com/LukViper/vibePrompt
# Live URL used by the extension: https://vibeprompt.onrender.com

services:
  - type: web
    name: vibeprompt
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
